suite: Test ServiceMonitor

templates:
  - "*.yaml"

release:
  name: descheduler

set:
  kind: Deployment
  serviceMonitor:
    enabled: true

tests:
  - it: uses default ServiceMonitor apiVersion
    template: templates/servicemonitor.yaml
    asserts:
      - equal:
          path: apiVersion
          value: monitoring.coreos.com/v1

  - it: supports overriding ServiceMonitor apiVersion
    set:
      serviceMonitor:
        enabled: true
        apiVersion: azmonitoring.coreos.com/v1
    template: templates/servicemonitor.yaml
    asserts:
      - equal:
          path: apiVersion
          value: azmonitoring.coreos.com/v1

  - it: sets honorLabels to true by default
    template: templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true

  - it: allows disabling honorLabels
    set:
      serviceMonitor:
        honorLabels: false
    template: templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].honorLabels
          value: false
